# Feature inventory.
#
# The functions DJs expect from professional DJ software, compiled from public user
# documentation on 12 November 2026.
#
# Each feature has an id (unique in its area), a name, a milestone (M0 to M5, or "later" when
# it has none), a status (planned, in_progress, done) and, when done, the evidence: the test or
# command that demonstrates it. The first complete version is everything from M0 to M3.
#
# `cargo xtask parity --check` validates this file. The summary in ROADMAP.md is refreshed by
# the release pull request, not by the pull request that changes a status.
# What is out of scope is in docs/gaps.md.

[[area]]
id = "interface"
title = "Interface"
features = [
  { id = "status-header", name = "Status header: audio, load, dropout counter, master meter, clock, settings", milestone = "M2", status = "done", evidence = "cargo test -p platter-ui-egui --test panels; the clock waits for the local time zone, see docs/behavior/interface.md" },
  { id = "midi-indicator", name = "MIDI indicator in the header", milestone = "M3", status = "done", evidence = "cargo test -p platter-ui-egui --test midi_indicator; no real MIDI controller tried yet, see ROADMAP.md" },
  { id = "recording-indicator", name = "Recording indicator in the header", milestone = "M4", status = "planned" },
  { id = "layout-selector", name = "Layout selector", milestone = "M4", status = "done", evidence = "cargo test -p platter-ui-egui --test panels; two or four decks, chosen in the preferences, see docs/behavior/interface.md" },
  { id = "fullscreen", name = "Full screen", milestone = "M3", status = "done", evidence = "cargo test -p platter-ui-egui --test panels; the real window has not been looked at in full screen, see ROADMAP.md" },
  { id = "tooltips", name = "Tooltips", milestone = "M3", status = "done", evidence = "cargo test -p platter-ui-egui --test tooltips; a disabled control shows no reason yet, see docs/behavior/interface.md" },
  { id = "deck-sizes", name = "Two deck sizes: compact and full", milestone = "M3", status = "done", evidence = "cargo test -p platter-ui-egui --test deck_size --test settings_mixer; two sizes, not five, see docs/behavior/interface.md" },
  { id = "parallel-waveforms", name = "Parallel waveforms", milestone = "M3", status = "done", evidence = "cargo test -p platter-ui-egui --test panels; each lane keeps its own zoom, see docs/behavior/waveform.md" },
  { id = "task-layouts", name = "Layouts per task: mixing, preparation, browser, parallel", milestone = "M4", status = "planned" },
  { id = "custom-layouts", name = "Custom layouts", milestone = "M4", status = "planned" },
]

