# Platter icons as shape data. 43 original icons, licensed with the project (MIT OR Apache-2.0).
# Grid: 24 x 24 units. Stroke icons: no fill, stroke width 1.5, round caps and round joins.
# Solid icons (solid = true): filled, no stroke.
# `shapes` holds SVG shape elements. Elements used: circle, path, rect.
# An attribute on a shape (fill, stroke, stroke-width) overrides the icon's default for that shape.
# The application draws every shape in the colour of the text beside the icon.
# Each icon is one valid SVG when wrapped as:
#   <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
#        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> shapes </svg>
# and, for solid icons, with fill="currentColor" stroke="none" instead.

grid = 24
stroke_width = 1.5

