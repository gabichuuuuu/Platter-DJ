version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      audio-stack:
        patterns:
          - "cpal"
          - "symphonia*"
      egui-stack:
        patterns:
          - "egui*"
          - "eframe"
          - "epaint*"
          - "ecolor"
          - "emath"
          - "winit"
          - "wgpu*"
          - "naga"
          - "accesskit*"
      cargo-patch:
        update-types:
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
