# Keyboard shortcuts of Platter.
#
# Each [[binding]] gives a key chord and the command it triggers. Every other key of the
# binding is a parameter of that command. The commands and their parameters are listed in
# docs/behavior/keyboard.md.
#
# keys     A key, alone or with Shift, Ctrl or Alt: "Z", "Shift + Left", "Ctrl + Comma".
#          Keys are named in English: letters, digits, F1 to F12, Space, Enter, Left, Right,
#          Up, Down, Comma, Period, Minus, Plus.
# command  The identifier of the command.
# release  Optional: the parameters to send when the key comes up. Commands that act while
#          a key is held (deck.cue, deck.cup) need nothing here.
#
# Platter reads this file when it starts. A mistake in it is reported in the log and the
# default shortcuts are used instead.

# Deck A

[[binding]]
keys = "Z"
command = "deck.play_pause"
deck = "a"

[[binding]]
keys = "X"
command = "deck.cue"
deck = "a"

[[binding]]
keys = "C"
command = "deck.cup"
deck = "a"

[[binding]]
keys = "Q"
command = "deck.nudge"
deck = "a"
amount = -0.04
release = { deck = "a", amount = 0.0 }

[[binding]]
keys = "W"
command = "deck.nudge"
deck = "a"
amount = 0.04
release = { deck = "a", amount = 0.0 }

[[binding]]
keys = "1"
command = "mixer.eq.kill.toggle"
deck = "a"
band = "low"

[[binding]]
keys = "2"
command = "mixer.eq.kill.toggle"
deck = "a"
band = "mid"

[[binding]]
keys = "3"
command = "mixer.eq.kill.toggle"
deck = "a"
band = "high"

[[binding]]
keys = "4"
command = "mixer.cue.toggle"
deck = "a"

[[binding]]
keys = "Shift + Left"
command = "browser.load_selected"
deck = "a"

[[binding]]
keys = "F1"
command = "waveform.zoom.out"
deck = "a"

[[binding]]
keys = "F2"
command = "waveform.zoom.in"
deck = "a"

[[binding]]
keys = "A"
command = "deck.loop.toggle"
deck = "a"

[[binding]]
keys = "S"
command = "deck.loop.size.step"
deck = "a"
direction = "down"

[[binding]]
keys = "D"
command = "deck.loop.size.step"
deck = "a"
direction = "up"

[[binding]]
keys = "E"
command = "deck.beatjump"
deck = "a"
direction = "back"

[[binding]]
keys = "R"
command = "deck.beatjump"
deck = "a"
direction = "forward"

