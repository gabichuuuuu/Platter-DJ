# Policy for `cargo deny check`. The reasons are in AGENTS.md ("Closed decisions") and
# docs/legal-notes.md.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
# Permissive licences only. A new permissive licence is added here with a comment naming the
# crate that brings it. GPL, AGPL and LGPL are never added: the dependency is removed instead.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
# The list is the project policy, not a mirror of the licences in use today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, without a version: none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
