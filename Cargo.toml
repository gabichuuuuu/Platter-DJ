[workspace]
resolver = "3"
members = ["apps/platter", "apps/platter-cli", "crates/audio-io", "crates/core", "crates/decode", "crates/dsp", "crates/engine", "crates/testkit", "crates/ui-egui", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[workspace.dependencies]
cargo_metadata = "0.23.1"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "wgpu", "x11"] }
egui = { version = "0.37.0", default-features = false }
proptest = "1.12.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false }
toml = "1.2.1"
