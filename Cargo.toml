[workspace]
resolver = "3"
members = ["apps/platter", "apps/platter-cli", "crates/analysis", "crates/audio-io", "crates/control", "crates/core", "crates/decode", "crates/device-io", "crates/dsp", "crates/engine", "crates/library", "crates/mcp", "crates/testkit", "crates/ui-egui", "xtask"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[workspace.dependencies]
cargo_metadata = "0.23.1"
cpal = "0.18.2"
midir = "0.11.1"
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "wgpu", "x11"] }
egui = { version = "0.37.0", default-features = false }
proptest = "1.12.0"
rtrb = "0.4.1"
# The SQLite of the library is compiled from source: the same version on every platform.
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false }
timestretch = { version = "0.16.0", default-features = false }
toml = "1.2.1"
zune-jpeg = "0.5.15"
zune-png = "0.5.2"

# The interface tests draw tens of thousands of frames; unoptimised, the layout, the shaping
# and the rasterising of the text take most of their time. The crates on that path are
# optimised in the builds of the tests, and of debug runs, too. See
# docs/decisions/0036-optimised-interface-dependencies.md.
[profile.dev.package]
ahash = { opt-level = 2 }
ecolor = { opt-level = 2 }
egui = { opt-level = 2 }
emath = { opt-level = 2 }
epaint = { opt-level = 2 }
fearless_simd = { opt-level = 2 }
font-types = { opt-level = 2 }
harfrust = { opt-level = 2 }
hashbrown = { opt-level = 2 }
kurbo = { opt-level = 2 }
peniko = { opt-level = 2 }
read-fonts = { opt-level = 2 }
skrifa = { opt-level = 2 }
smallvec = { opt-level = 2 }
vello_common = { opt-level = 2 }
vello_cpu = { opt-level = 2 }
